# Todos los días revisa si MTGJSON publicó mazos precon nuevos y actualiza web/mazos-extra.json.
# La página lee ese archivo desde GitHub, así que los mazos nuevos aparecen sin subir un parche.
name: Actualizar mazos precon
on:
  schedule:
    - cron: "17 13 * * *"     # todos los días, ~10:17 de Chile (después de que MTGJSON publica)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  mazos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node herramientas/actualizar-mazos.mjs
      - name: Guardar si cambió
        run: |
          if [ -n "$(git status --porcelain web/mazos-extra.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/mazos-extra.json
            git commit -m "Mazos precon: actualización automática desde MTGJSON"
            git push
          fi
