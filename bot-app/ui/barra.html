<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Barra</title>
<style>
:root{--bg:#0e0908;--s2:#211714;--line:#3a2a25;--fg:#f4ece6;--mut:#a8968e;--red:#c8321a;--red2:#e0472b;--gold:#e9b44c;--ok:#4fbf7a;--warn:#f0a63a;--err:#ff6b55}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:linear-gradient(180deg,#1a100d,#120b09);border-bottom:1px solid var(--line);color:var(--fg);font:14px/1 "Segoe UI",system-ui,sans-serif;display:flex;align-items:center;gap:10px;padding:0 12px;-webkit-user-select:none;user-select:none}
img{width:32px;height:32px}
.marca{display:flex;flex-direction:column;gap:3px;margin-right:10px}
.marca b{font-size:14px;letter-spacing:.02em}
.marca small{font-size:10px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.tab{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:10px;background:transparent;border:1px solid transparent;color:var(--mut);font:600 14px "Segoe UI",system-ui,sans-serif;cursor:pointer}
.tab:hover{color:var(--fg);background:var(--s2)}
.tab.on{color:#fff;background:#2e1712;border-color:var(--red2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.warn{background:var(--warn)}
.dot.err{background:var(--err)}
.sp{flex:1}
.btn{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--s2);color:var(--fg);font:600 13px "Segoe UI",system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn:hover{border-color:#5a443d}
.btn.tv.on{background:linear-gradient(180deg,var(--red2),var(--red));border-color:#e65a3e}
.btn.ic{width:34px;padding:0;justify-content:center}
.btn,.tab,.seg button{transition:background-color .18s,border-color .18s,color .18s,transform .12s}
.btn:active,.tab:active,.seg button:active{transform:scale(.96)}
/* Modo 2 pantallas: qué se ve en el proyector */
.proy{display:flex;align-items:center;gap:8px;opacity:0;transform:translateX(8px);transition:opacity .25s,transform .25s;pointer-events:none}
.proy.on{opacity:1;transform:none;pointer-events:auto}
.proy[hidden]{display:none}
.proy .lbl{font-size:11px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.proy .lbl i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--err);margin-right:6px;box-shadow:0 0 8px var(--err);animation:vivo 1.6s ease-in-out infinite}
@keyframes vivo{50%{opacity:.35}}
.seg{display:flex;padding:3px;gap:3px;border:1px solid var(--line);border-radius:10px;background:#160e0c}
.seg button{height:28px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--mut);font:600 13px "Segoe UI",system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--red2),var(--red));color:#fff}
.aviso2{font-size:11px;color:var(--warn);max-width:170px;line-height:1.3}
body.proy-on .marca{display:none}
@media (max-width:1500px){body.proy-on .btn .t{display:none}}
@media (max-width:1180px){.btn .t{display:none}}
@media (prefers-reduced-motion:reduce){.proy{transition:none}.proy .lbl i{animation:none}}
</style>
</head>
<body>
  <img src="logo.png" alt="">
  <div class="marca"><small>Liga El Desafío</small><b>Organizador</b></div>
  <button class="tab on" type="button" data-v="liga">🏆 Liga</button>
  <button class="tab" type="button" data-v="bot"><span class="dot" id="dot"></span>Bot de WhatsApp</button>
  <span class="sp"></span>
  <div class="proy" id="proy" hidden>
    <span class="lbl"><i></i>En el proyector</span>
    <div class="seg" role="group" aria-label="Qué se ve en el proyector">
      <button type="button" data-proy="live" aria-pressed="true" title="Mesas, reloj y standing">🃏 Mesas y reloj</button>
      <button type="button" data-proy="sorteo" aria-pressed="false" title="Ruleta del sorteo. Al girar desde aquí, el proyector se pasa solo a la ruleta">🎡 Ruleta</button>
    </div>
    <span class="aviso2" id="aviso2" hidden>Sin 2ª pantalla: lleva la ventana al proyector y toca ⛶</span>
    <button class="btn ic" type="button" id="completa" title="Pantalla completa en el proyector">⛶</button>
  </div>
  <button class="btn tv" type="button" id="tv" title="Separa en 2 pantallas: aquí quedan los controles y en el segundo monitor (proyector o TV) se ve la vista para el público">🖥️ 2 pantallas</button>
  <button class="btn" type="button" id="pub" title="Abre en el navegador la página que ven los jugadores">🌐<span class="t"> Página de jugadores</span></button>
  <button class="btn ic" type="button" id="rec" title="Recargar">↻</button>
<script>
const $ = id => document.getElementById(id);
document.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", async () => {
  await bot.vista(b.dataset.v);
  document.querySelectorAll("[data-v]").forEach(x => x.classList.toggle("on", x === b));
}));
function pintarPantalla(d){
  const on = !!(d && d.on);
  document.body.classList.toggle("proy-on", on);
  $("tv").classList.toggle("on", on); $("tv").textContent = on ? "✕ Dejar de proyectar" : "🖥️ 2 pantallas";
  const p = $("proy");
  if (on){ p.hidden = false; requestAnimationFrame(() => p.classList.add("on")); }
  else { p.classList.remove("on"); setTimeout(() => { if (!p.classList.contains("on")) p.hidden = true; }, 260); }
  if (!on) return;
  document.querySelectorAll("[data-proy]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.proy === (d.vista === "sorteo" ? "sorteo" : "live"))));
  $("aviso2").hidden = !!d.segunda || !!d.completa;
  $("completa").title = d.completa ? "Salir de pantalla completa" : "Pantalla completa en el proyector";
}
$("tv").addEventListener("click", async () => { await bot.pantalla(); });
document.querySelectorAll("[data-proy]").forEach(b => b.addEventListener("click", async () => {
  document.querySelectorAll("[data-proy]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  await bot.proyectar(b.dataset.proy);
}));
$("completa").addEventListener("click", () => bot.pantallaCompleta());
$("pub").addEventListener("click", () => bot.publica());
$("rec").addEventListener("click", () => bot.recargar());
bot.on("vista", v => document.querySelectorAll("[data-v]").forEach(x => x.classList.toggle("on", x.dataset.v === v)));
bot.on("pantalla", pintarPantalla);
const color = s => s === "listo" ? "ok" : ["desconectado", "fallo", "error"].includes(s) ? "err" : "warn";
const titulo = s => ({listo: "Bot conectado", vincular: "Falta vincular WhatsApp", desconectado: "Bot desconectado", fallo: "No se pudo iniciar sesión", error: "Error en el bot", reiniciando: "Bot reiniciándose"}[s] || "Conectando el bot…");
bot.on("estado", d => { $("dot").className = "dot " + color(d.s); $("dot").title = titulo(d.s); });
bot.inicio().then(i => { if (i && i.estado){ $("dot").className = "dot " + color(i.estado); $("dot").title = titulo(i.estado); } });
</script>
</body>
</html>
